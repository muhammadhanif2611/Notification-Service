name: Publish PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - 'sdk-python/v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    permissions:
      id-token: write  # untuk trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and SDK dependencies
        run: pip install build twine requests httpx

      - name: Validate SDK
        run: python -m unittest discover -s tests -v

      - name: Build package
        run: |
          python -m build --outdir ../../artifacts/python
          python -m twine check ../../artifacts/python/*

      - name: Publish ke PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/python/
